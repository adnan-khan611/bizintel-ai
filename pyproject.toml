[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizintel-ai"
version = "0.1.0"
description = "AI Business Intelligence and Decision Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BizIntel AI contributors" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bizintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
exclude = [".venv", ".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
